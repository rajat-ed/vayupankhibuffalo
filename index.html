<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vayupankhi Buffalo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="title">Vayupankhi Buffalo </div>
        <div id="score">Score: 0</div>
        <div id="difficulty" class="hidden">Difficulty Up!</div>
        <div id="clipboardMessage" class="hidden">Copied to clipboard!</div>
        <div id="namePrompt">
            <h1>Vayupankhi Buffalo</h1>
            <p>Enter your name:</p>
            <input type="text" id="playerName" maxlength="20" placeholder="Your Name">
            <button id="startBtn">Start Game</button>
        </div>
        <div id="gameOver" class="hidden">
            <h1>Game Over</h1>
            <p><span id="playerNameDisplay"></span>, your score: <span id="finalScore">0</span></p>
            <button id="shareBtn">Share Result</button>
            <button id="restartBtn">Restart</button>
        </div>
    <script src="game.js"></script>
</body>
</html>
